# ============================================================
# Registro de Ventas - Compose para ENTREGA al cliente
# ------------------------------------------------------------
# No construye imagenes: usa las imagenes preconstruidas que
# vienen en la carpeta imagenes/ (cargadas con cargar-imagenes).
# Este archivo se entrega renombrado como docker-compose.yml.
# ============================================================
services:
  db:
    image: postgres:16-alpine
    pull_policy: never
    container_name: registro-ventas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - registro-ventas

  backend:
    image: registro-ventas-backend:latest
    pull_policy: never
    container_name: registro-ventas-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PRICE_ALERT_THRESHOLD: ${PRICE_ALERT_THRESHOLD:-20}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - registro-ventas

  frontend:
    image: registro-ventas-frontend:latest
    pull_policy: never
    container_name: registro-ventas-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - registro-ventas

  caddy:
    image: caddy:2-alpine
    pull_policy: never
    container_name: registro-ventas-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - registro-ventas

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  registro-ventas:
    driver: bridge
