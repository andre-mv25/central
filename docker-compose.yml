services:
  db:
    image: postgres:16-alpine
    container_name: inventario-papa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-inventario}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-inventario}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventario-papa

  backend:
    build:
      context: ./backend_py
    image: inventario-papa-backend:latest
    container_name: inventario-papa-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-inventario}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 480
      BCRYPT_ROUNDS: 12
      ALLOW_NEGATIVE_STOCK: "false"
      CLASSIFICATION_TOLERANCE_KG: "0.5"
      COST_ALLOCATION_METHOD: "peso"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:80"
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventario-papa
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    image: inventario-papa-frontend:latest
    container_name: inventario-papa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - inventario-papa
    ports:
      - "5173:5173"

  caddy:
    image: caddy:2-alpine
    container_name: inventario-papa-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - inventario-papa

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  inventario-papa:
    driver: bridge